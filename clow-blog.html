<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giải Mã Bài Clow | ClowCat Patronus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="hinh/favicon.png">
  <link rel="stylesheet" href="style.css?v=20260623">
  <!-- SEO tags -->
  <meta name="description" content="Khám phá và giải mã ý nghĩa các lá bài Clow cùng ClowCat Patronus. Thông điệp chữa lành, ý nghĩa các lá bài, các trải bài và hướng dẫn chi tiết.">
</head>
<body class="js-loading blog-page">
  <!-- NAV -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <picture>
          <source srcset="hinh/logo.webp" type="image/webp" />
          <img src="hinh/logo.png" alt="ClowCat Logo" class="nav-logo-img" decoding="async" fetchpriority="high" />
        </picture>
        <span style="font-family:'Playfair Display',serif; font-size:1.1rem; color:var(--gold-light); margin-left:8px; font-weight:700;">ClowCat Patronus</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Về trang chủ</a></li>
        <li><a href="index.html#contact" class="nav-cta">Đặt lịch ngay</a></li>
      </ul>
    </div>
  </nav>

  <!-- Background Elements -->
  <div class="hero-bg" style="position:fixed; z-index:-1; inset:0;">
    <div class="star-field"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <main class="blog-main container" style="padding-top: 120px; min-height: 80vh;">
    <!-- Blog Header -->
    <div class="text-center" style="margin-bottom: 40px;">
      <div class="section-label" style="margin-bottom: 12px; letter-spacing: 2px;">✦ GIẢI MÃ BÀI CLOW ✦</div>
      
      <!-- Topics Ribbon -->
      <div class="blog-topics-ribbon">
        <div class="blog-topic-list" id="public-topics-list">
          <!-- Render from JS -->
          <div style="opacity:0.5; font-size:0.9rem; padding: 10px;">Đang tải...</div>
        </div>
      </div>
    </div>

    <!-- Main Content: Posts -->
    <div class="blog-content">
      <div class="blog-grid" id="public-posts-grid">
        <!-- Render from JS -->
        <div style="grid-column: 1/-1; text-align:center; opacity:0.5; padding: 40px;">Đang tải bài viết...</div>
      </div>
      
      <!-- Pagination -->
      <div class="blog-pagination" id="public-posts-pagination">
        <!-- Render from JS -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container text-center">
      <picture>
        <source srcset="hinh/logo.webp" type="image/webp">
        <img src="hinh/logo.png" alt="Logo ClowCat Patronus" class="footer-logo" loading="lazy">
      </picture>
      <div class="footer-brand">
        <h3 class="footer-title">ClowCat Patronus</h3>
        <p>KHÁM PHÁ BẢN THÂN, BẬT PHÁ TIỀM NĂNG</p>
      </div>
      <p class="footer-copyright">© 2024 ClowCat Patronus. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Blog logic init
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initBlogPage === 'function') {
        initBlogPage();
      } else {
        console.error('script.js not loaded or initBlogPage missing');
      }
    });
  </script>
  <script src="script.js?v=20260623-blog"></script>
</body>
</html>
